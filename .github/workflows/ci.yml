name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate public tree
        run: python scripts/check_public_tree.py
      - name: Validate agent compatibility
        run: python scripts/check_agent_compatibility.py
      - name: Run tests
        run: python scripts/data_lens.py test
